worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # Writable tmp paths (needed when nginx runs non-root)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/xml image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Health probes used by the k8s chart
    location = /healthz     { access_log off; return 200 "ok\n"; }
    location = /readinessz  { access_log off; return 200 "ok\n"; }

    # Hashed static assets - long cache
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
      expires 30d;
      access_log off;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    # SPA fallback: gateway strips /riverside-seating/ prefix, so pod sees /*
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
